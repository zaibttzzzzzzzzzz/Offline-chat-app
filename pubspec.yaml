name: offline_mesh_flutter
description: 100% offline P2P mesh chat — WhatsApp-style UI, Nearby Connections, multi-hop relay, serverless WebRTC.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  uuid: ^4.5.1
  cryptography: ^2.7.0
  permission_handler: ^11.4.0
  flutter_webrtc: ^0.12.12+hotfix.1
  nearby_connections: ^4.1.1
  flutter_image_compress: ^2.4.0
  image_picker: ^1.1.2
  flutter_background_service: ^5.1.0
  flutter_background_service_android: ^5.0.0
  flutter_local_notifications: ^18.0.1
  intl: ^0.20.2
  collection: ^1.19.1
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
